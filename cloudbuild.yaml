# Google Cloud Build -> Cloud Run Automated Deployment Pipeline
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/eldercare:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/eldercare:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/eldercare:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'eldercare'
      - '--image=gcr.io/$PROJECT_ID/eldercare:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
images:
  - 'gcr.io/$PROJECT_ID/eldercare:latest'
